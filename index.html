  <div class="card">
    <label>Modo<select id="modo"><option value="clasico">Clásico</option><option value="pista">Con pista</option><option value="caos">Caos (impostores al azar)</option></select></label>

    <div class="row" style="margin-top:10px"><label style="flex:1"><input type="checkbox" id="tm" style="width:auto"> Temporizador</label><input id="min" type="number" min="1" max="60" value="5" style="width:80px"> min</div>
  </div>
  <button id="go">Empezar</button>
  <a href="admin.html" style="display:block;text-align:center;color:#8b7fb0;margin:14px">Admin</a>
</section>
